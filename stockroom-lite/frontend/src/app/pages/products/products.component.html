<h2>Products</h2>
<div class="search-row">
  <mat-form-field><mat-label>Search products</mat-label><input matInput [(ngModel)]="search" /></mat-form-field>
  <button mat-stroked-button (click)="loadProducts()">Search</button>
</div>
<form [formGroup]="form" (ngSubmit)="add()" class="form-grid">
  <mat-form-field><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
  <mat-form-field><mat-label>SKU</mat-label><input matInput formControlName="sku" /></mat-form-field>
  <mat-form-field><mat-label>Description</mat-label><input matInput formControlName="description" /></mat-form-field>
  <mat-form-field><mat-label>Unit Price</mat-label><input matInput type="number" formControlName="unitPrice" /></mat-form-field>
  <mat-form-field><mat-label>Quantity</mat-label><input matInput type="number" formControlName="quantity" /></mat-form-field>
  <mat-form-field><mat-label>Low Stock Threshold</mat-label><input matInput type="number" formControlName="lowStockThreshold" /></mat-form-field>
  <mat-form-field>
    <mat-label>Category</mat-label>
    <mat-select formControlName="categoryId">
      <mat-option [value]="0">Select</mat-option>
      <mat-option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Supplier</mat-label>
    <mat-select formControlName="supplierId">
      <mat-option [value]="0">Select</mat-option>
      <mat-option *ngFor="let s of suppliers" [value]="s.id">{{ s.name }}</mat-option>
    </mat-select>
  </mat-form-field>
  <input type="file" (change)="onImage($event)" accept="image/*" />
  <button mat-flat-button color="primary">Add Product</button>
</form>

<ul>
  <li *ngFor="let p of products">
    {{ p.name }} ({{ p.sku }}) - Qty {{ p.quantity }} - ₹{{ p.unitPrice }}
    <button mat-button color="warn" (click)="deleteItem(p.id)">Delete</button>
  </li>
</ul>
