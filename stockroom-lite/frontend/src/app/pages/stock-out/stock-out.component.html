<h2>Stock Out</h2>
<form [formGroup]="form" (ngSubmit)="submit()" class="form-row">
  <mat-form-field><mat-label>Product ID</mat-label><input matInput type="number" formControlName="productId" /></mat-form-field>
  <mat-form-field><mat-label>Quantity</mat-label><input matInput type="number" formControlName="quantity" /></mat-form-field>
  <mat-form-field><mat-label>Unit Price</mat-label><input matInput type="number" formControlName="unitPrice" /></mat-form-field>
  <mat-form-field><mat-label>Note</mat-label><input matInput formControlName="note" /></mat-form-field>
  <button mat-flat-button color="primary">Submit</button>
</form>
