<mat-toolbar color="primary">
  <span>Stockroom Lite</span>
  <span class="spacer"></span>
  <ng-container *ngIf="authService.isAuthenticated()">
    <a mat-button routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a mat-button routerLink="/products" routerLinkActive="active">Products</a>
    <a mat-button routerLink="/categories" routerLinkActive="active">Categories</a>
    <a mat-button routerLink="/suppliers" routerLinkActive="active">Suppliers</a>
    <a mat-button routerLink="/stock-in" routerLinkActive="active">Stock In</a>
    <a mat-button routerLink="/stock-out" routerLinkActive="active">Stock Out</a>
    <a mat-button routerLink="/reports" routerLinkActive="active">Reports</a>
    <button mat-button (click)="authService.logout()">Logout</button>
  </ng-container>
</mat-toolbar>

<main class="container">
  <router-outlet></router-outlet>
</main>
